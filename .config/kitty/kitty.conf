# === ШРИФТЫ ===
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Слегка увеличиваем межстрочный интервал для "воздушности" Material 3
modify_font cell_height 115%

# === ОКНО И ОТСТУПЫ (КАРТОЧКА PIXEL) ===
# Большие отступы, чтобы текст не упирался в скругленные углы окна
window_padding_width 40 40
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
# Легкая прозрачность фона (опционально, можно поставить 1.0 для плотного цвета)
background_opacity 0.96

# === КУРСОР И АНИМАЦИЯ (EXPRESSIVE MOTION) ===
cursor #a8c7fa
cursor_text_color #062e6f
cursor_shape beam
cursor_beam_thickness 2.0

# Фирменный плавный шлейф при перемещении курсора (требует Kitty 0.37+)
cursor_trail 1
cursor_trail_decay 0.1 0.35
cursor_trail_start_threshold 2

# === ВКЛАДКИ В СТИЛЕ КАПСУЛ (MATERIAL PILLS) ===
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_min_tabs 2

# Отступы вокруг панели вкладок, чтобы они "парили"
tab_bar_margin_width 12.0
tab_bar_margin_height 10.0 4.0

# Формат названия вкладки с внутренними полями
tab_title_template "  {index}: {title}  "
active_tab_title_template "  󰆍 {title}  "

# Цвета вкладок (активная — голубая капсула @primary, неактивные — @surface_container)
tab_bar_background #111318
active_tab_foreground   #062e6f
active_tab_background   #a8c7fa
active_tab_font_style   bold
inactive_tab_foreground #c4c6d0
inactive_tab_background #1d2024
inactive_tab_font_style normal

# === ПАЛИТРА MATERIAL YOU (DARK TONAL SPOT) ===
# Базовые цвета (точно как в ironbar и wofi)
background            #111318
foreground            #e2e2e9
selection_background  #284777
selection_foreground  #d6e3ff

# Ссылки
url_color             #a8c7fa
url_style             curly

# Границы сплитов (если открыто несколько окон внутри kitty)
active_border_color   #a8c7fa
inactive_border_color #282a2f
bell_border_color     #ffdcbe

# --- 16 ЦВЕТОВ ТЕРМИНАЛА (EXPRESSIVE PASTELS) ---

# Черный / Поверхности (Surface Containers)
color0  #1d2024
color8  #44474f

# Красный (Material Error / Coral)
color1  #ffb4ab
color9  #ffdad6

# Зеленый (Цвет капсулы батареи — Mint)
color2  #a6f2d1
color10 #c2fce0

# Желтый / Оранжевый (Цвет капсулы погоды — Sun Amber)
color3  #ffdcbe
color11 #ffeedd

# Синий (Главный акцент Pixel — Primary Blue)
color4  #a8c7fa
color12 #d6e3ff

# Пурпурный / Розовый (Цвет капсулы плеера — Tertiary Lilac)
color5  #fad8fd
color13 #fde8ff

# Голубой / Бирюзовый (Secondary Cyan)
color6  #b4ebff
color14 #d9f5ff

# Белый / Текст (On Surface)
color7  #c4c6d0
color15 #e2e2e9
